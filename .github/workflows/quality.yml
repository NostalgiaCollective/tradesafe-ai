name: Quality gates
on:
  push:
    branches: [main, astra/production-mvp]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run test:staging:browser:list
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:smoke
      - run: npm audit --audit-level=high
